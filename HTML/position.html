<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            width: 600px;
            height: 300px;
            border: 1px solid #000;
            margin: auto;
            position: relative;

        }

        .grass {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .box .grass img {
            width: 100%;
            height: 300px;
        }

        .child {
            position: absolute;
            width: 90px;
            height: 90px;
            /* top: 0;
            bottom: 0; */
            top: 50%;
            left: 50%;
            transform: translate(-80%, 60%);
            z-index: 1;
        }

        .grass .child img {
            width: 80px;
            height: 90px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="grass">
            <img src="../imgs/grass.jpg">

            <div class="child">
                <img src="../imgs/Jerry_Mouse.png">
            </div>
        </div>

    </div>
</body>

</html>
