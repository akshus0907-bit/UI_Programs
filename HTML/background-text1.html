<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Outfit", sans-serif;
      }

      .container {
        width: 100%;
        min-height: 100px;
        background-color: #151517;
      }

      .header {
        width: 100%;
        height: 630px;
        background-image: url(../imgs/s6.png);
        background-size: 80% 100%;
        background-repeat: no-repeat;
        background-position: center;
        position: relative;
      }

      .info {
        width: 500px;
        min-height: 290px;
        border: 8px solid #fff;
        position: absolute;
        right: 100px;
        top: 230px;
        box-shadow: 10px 10px 10px rgba(255, 255, 255, 0.3);
        border-image: linear-gradient(
            90deg,
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
          )
          1;

        animation: borderMove 3s linear infinite;
      }

      @keyframes borderMove {
        from {
          filter: hue-rotate(0deg);
        }

        to {
          filter: hue-rotate(360deg);
        }
      }

      .info h1 {
        color: white;
        text-align: center;
        padding: 20px;
        font-weight: 100;
      }

      .header-menu {
        width: 100%;
        height: 100px;

        position: absolute;
        top: 10px;
      }
      .header-menu .logo {
        width: 15%;
        float: left;
        height: 60px;
        position: relative;
      }
      .photo {
        width: 40px;
        height: 40px;
        /* border: 1px solid white; */
        float: left;

        position: absolute;
        top: 10px;
        left: 10px;
      }
      .photo img {
        width: 100%;
      }
      .cname h1 {
        color: white;
        padding: 10px;
        font-size: 2.4vw;
        font-weight: 300;
        float: left;
        position: absolute;
        left: 46px;
      }

      .header-menu .menu {
        width: 59%;
        float: right;
        height: 60px;
      }
      .menu ul {
        list-style-type: none;
        width: 100%;
        text-align: end;
      }
      .menu ul li {
        display: inline-block;
        line-height: 60px;
        margin-right: 10px;
      }
      .menu ul li a {
        color: white;
        padding: 10px;
        text-decoration: none;
      }
      .menu ul li a:hover {
        transition: all 0.3s linear;
        box-shadow:
          0px 0px 10px rgba(255, 255, 255, 0.3),
          0px 0px 20px rgba(255, 255, 255, 0.3),
          0px 0px 40px rgba(255, 255, 255, 0.3);
      }

      .clearfix::after {
        content: "";
        clear: both;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="header-menu clearfix">
          <div class="logo clearfix">
            <div class="photo">
              <img src="../imgs/logo12.jpg" />
            </div>
            <div class="cname">
              <h1>ByteCode</h1>
            </div>
          </div>

          <div class="menu">
            <ul>
              <li><a href="">Home</a></li>
              <li><a href="">About</a></li>
              <li><a href="">Services</a></li>
              <li><a href="">Products</a></li>
              <li><a href="">Contact</a></li>
            </ul>
          </div>
        </div>
        <div class="info">
          <h1>
            "Every page you read is an investment in the person you are
            becoming. Keep learning, keep growing, and never stop believing in
            your potential."
          </h1>
        </div>
      </div>
    </div>
  </body>
</html>
